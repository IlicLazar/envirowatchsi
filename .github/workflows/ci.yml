name: CI

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Run unit tests
        run: ./EnviroWatchSI/gradlew :server:test -p ./EnviroWatchSI

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: EnviroWatchSI/server/build/reports/tests/test/