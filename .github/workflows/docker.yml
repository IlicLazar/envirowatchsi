name: Docker CI/CD

on:
  push:
    branches:
      - develop
      - release

jobs:
  test:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

      ```
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20

        - name: Install backend dependencies
          run: |
            cd envirowatchsi-api
            npm install

        - name: Run backend tests
          run: |
            cd envirowatchsi-api
            npm test
    ```

  deploy:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest

      ```
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build backend image
          run: |
            docker build -t dejanrankicc/envirowatchsi-backend:latest ./envirowatchsi-api

        - name: Push backend image
          run: |
            docker push dejanrankicc/envirowatchsi-backend:latest

        - name: Build frontend image
          run: |
            docker build -t dejanrankicc/envirowatchsi-frontend:latest ./envirowatchsi-web

        - name: Push frontend image
          run: |
            docker push dejanrankicc/envirowatchsi-frontend:latest

        - name: Trigger Azure Webhook
          run: |
            curl -X POST https://envirowatchsi.com:8080/deploy \
              -H "x-deploy-secret: ${{ secrets.DEPLOY_SECRET }}" \
              -H "x-github-event: push"
      ```
